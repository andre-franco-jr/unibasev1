name: unienergy_app
description: App de monitoramento de usinas solares Unienergy
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Networking
  dio: ^5.4.0
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Charts
  fl_chart: ^0.66.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true  
  assets:
    - assets/images/
    - assets/fonts/
  
  fonts:
    - family: Viga
      fonts:
        - asset: assets/fonts/Viga-Regular.ttf
    
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat.regular.ttf